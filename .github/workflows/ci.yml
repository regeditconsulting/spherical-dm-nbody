name: Python CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libgsl-dev \
          libfftw3-dev \
          libomp-dev \
          clang \
          make \
          python3 \
          python3-pip \
          python3-venv

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Clone and build NSphere
      run: |
        git clone https://github.com/kris-sigurdson/NSphere.git refs/NSphere
        cd refs/NSphere
        # Фиксируем версию (тот же коммит, что в setup.sh)
        git checkout 8f146665af4f1031d4c0c6008e034ec3de67afba
        make all

    - name: Run parser tests
      run: pytest tests/

    - name: Run mini NBody simulation (1000 particles)
      run: |
        ./refs/NSphere/bin/nsphere \
          --nparticles 1000 \
          --ntimesteps 100 \
          --tfinal 1 \
          --profile nfw \
          --tag ci_test
